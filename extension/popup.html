<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0f17;
      color: #e4e6f0;
    }
    .header {
      background: linear-gradient(135deg, rgba(74,68,219,.2), rgba(99,91,255,.08));
      border-bottom: 1px solid #2a2e42;
      padding: 18px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header svg {
      width: 28px;
      height: 28px;
      filter: drop-shadow(0 2px 8px rgba(99,91,255,.35));
    }
    .header h3 {
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .3px;
    }
    .status {
      text-align: center;
      padding: 24px 16px 16px;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .status-badge.active {
      background: rgba(52,211,153,.12);
      color: #34d399;
    }
    .status-badge.inactive {
      background: rgba(248,113,113,.12);
      color: #f87171;
    }
    .status-badge.checking {
      background: rgba(255,255,255,.06);
      color: #8b8fa3;
    }
    .status p {
      font-size: 11px;
      color: #8b8fa3;
      margin-top: 6px;
    }
    .actions {
      padding: 0 16px 16px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      text-align: center;
      text-decoration: none;
      color: #fff;
      transition: opacity .2s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary {
      background: linear-gradient(135deg, #635bff, #7b73ff);
      box-shadow: 0 2px 10px rgba(99,91,255,.3);
    }
    .btn-primary:hover { opacity: .88; }
    .btn-secondary {
      background: rgba(255,255,255,.07);
      border: 1px solid #2a2e42;
      color: #e4e6f0;
    }
    .btn-secondary:hover { background: rgba(255,255,255,.12); }
    .footer {
      text-align: center;
      padding: 12px;
      font-size: 10.5px;
      color: #4a4e64;
      border-top: 1px solid #2a2e42;
      letter-spacing: .2px;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sfLogoGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#7b73ff"/>
          <stop offset="100%" stop-color="#4a44db"/>
        </linearGradient>
      </defs>
      <circle cx="16" cy="16" r="15" fill="url(#sfLogoGrad)" opacity=".15"/>
      <path d="M18.5 5L9 17.5h5.5l-1 9.5L23 14.5h-5.5l1-9.5z" fill="url(#sfLogoGrad)" stroke="#7b73ff" stroke-width=".7" stroke-linejoin="round"/>
    </svg>
    <h3>AI Flow Builder</h3>
  </div>
  <div class="status">
    <div class="status-badge checking" id="statusBadge">Checking...</div>
    <p id="statusText"></p>
  </div>
  <div class="actions">
    <button class="btn btn-primary" id="toggleBtn">Abrir Sidebar no Salesforce</button>
    <button class="btn btn-secondary" id="settingsBtn">Configurações</button>
  </div>
  <div class="footer">v0.1.2 &middot; Salesforce AI Flow Builder</div>
  <script src="popup.js"></script>
</body>
</html>
