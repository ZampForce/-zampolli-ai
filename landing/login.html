<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Zampolli AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0b12; color: #e4e6f0;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      background: #12141f; border: 1px solid #2a2e42; border-radius: 20px;
      padding: 40px; width: 100%; max-width: 400px;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 20px; font-weight: 800; color: #fff;
      margin-bottom: 8px; text-decoration: none;
    }
    .logo svg { width: 32px; height: 32px; }
    .card h2 { font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .card > p { font-size: 14px; color: #8b8fa3; margin-bottom: 32px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #b0b4c8; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 10px;
      border: 1px solid #2a2e42; background: #0a0b12; color: #e4e6f0;
      font-size: 14px; font-family: inherit; margin-bottom: 16px; outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: #7b73ff; }
    .btn {
      width: 100%; padding: 13px; border-radius: 12px; border: none;
      font-size: 15px; font-weight: 700; color: #fff; cursor: pointer;
      background: linear-gradient(135deg, #7b73ff, #4a44db);
      transition: box-shadow .2s;
    }
    .btn:hover { box-shadow: 0 4px 20px rgba(123,115,255,.4); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .error-msg {
      background: #2a1515; border: 1px solid #4a2020; color: #f87171;
      padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none;
    }
    .footer-link {
      text-align: center; margin-top: 24px; font-size: 13px; color: #8b8fa3;
    }
    .footer-link a { color: #7b73ff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <a href="/" class="logo">
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="14" fill="#181b28" stroke="#4a44db" stroke-width="1.5"/>
        <path d="M9 10h14l-12 12h11" fill="none" stroke="url(#nz)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <defs><linearGradient id="nz" x1="0" y1="8" x2="32" y2="24"><stop offset="0%" stop-color="#b8a9ff"/><stop offset="100%" stop-color="#4a44db"/></linearGradient></defs>
      </svg>
      Zampolli AI
    </a>
    <h2>Entrar</h2>
    <p>Acesse sua conta Zampolli AI.</p>
    <div id="error" class="error-msg"></div>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" placeholder="seu@email.com" required>
      <label>Senha</label>
      <input type="password" id="password" placeholder="Sua senha" required>
      <button type="submit" class="btn" id="submitBtn">Entrar</button>
    </form>
    <div class="footer-link">Nao tem conta? <a href="/signup">Criar conta</a></div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var error = document.getElementById('error');
      var btn = document.getElementById('submitBtn');
      error.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        var r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        var data = await r.json();
        if (!r.ok || data.error) {
          error.textContent = data.error || 'Erro ao entrar.';
          error.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Entrar';
          return;
        }
        localStorage.setItem('zampolli_token', data.token);
        localStorage.setItem('zampolli_name', data.name);
        localStorage.setItem('zampolli_plan', data.plan);
        window.location.href = '/dashboard';
      } catch (err) {
        error.textContent = 'Erro de conexao. Tente novamente.';
        error.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
