services:
  - type: web
    name: zampolli-ai-backend
    env: node
    buildCommand: cd extension && npm install
    startCommand: cd extension && node backend-server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SALESFORCE_DOMAIN
        value: login

  - type: web
    name: zampolli-ai-web
    env: node
    buildCommand: npm install
    startCommand: node web-server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
